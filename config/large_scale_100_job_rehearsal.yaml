project:
  name: v4_5_100_job_rehearsal
  organism: human
  run_mode: production
  analysis_level: production_backend
  delivery_scope: internal_rehearsal
  delivery_mode: customer_delivery_rehearsal
  controlled_rehearsal: true
  customer_delivery_actual: false
  real_customer_delivery: false

batch:
  root: /shared/shen/2026/ultimate
  job_prefix: v4_5
  total_runnable_jobs: 100
  chunk_size: 10
  chunk_count: 10
  storage_budget_gb: 500

requested_distribution:
  rnaseq: 20
  scrna: 15
  proteomics: 15
  methylation: 10
  scatac: 10
  spatial: 10
  multiome: 8
  cite_seq: 5
  vdj: 4
  functional_state: 3

allowed_scope:
  - rnaseq controlled count-matrix rehearsal
  - scrna controlled h5ad/10x matrix rehearsal
  - proteomics controlled abundance-table rehearsal
  - methylation controlled beta-matrix rehearsal
  - scatac controlled peak-matrix rehearsal
  - spatial controlled Visium-matrix rehearsal
  - multiome controlled h5mu/paired-matrix rehearsal
  - cite_seq controlled feature-barcode rehearsal
  - vdj controlled Cell Ranger VDJ table rehearsal
  - functional_state controlled signature-scoring rehearsal

excluded_scope:
  - heavy algorithms
  - raw upstream production
  - FASTQ/BCL processing
  - atlas-scale downloads
  - CellChat/NicheNet communication inference
  - inferCNV/CopyKAT malignant inference
  - RNA velocity
  - full WNN/multiVI integration
  - clinical survival/risk model
  - real customer delivery

